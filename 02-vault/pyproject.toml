[project]
name = "vault"
version = "1.0.0"
description = "Local encrypted vault for your important documents, with expiry alerts."
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
ocr = ["pytesseract", "pillow"]

[project.scripts]
vault = "vault.cli:main"
boveda = "vault.cli:main"
